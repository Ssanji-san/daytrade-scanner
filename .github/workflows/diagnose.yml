name: diagnose

# Manual only. Prints the real Alpaca account/asset/order-rejection details
# (including error bodies) so a 422 can explain itself. No trading logic here.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbols to inspect and test-order (space separated)"
        required: false
        default: "AAPL"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe Alpaca paper account
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python scripts/diagnose_alpaca.py --probe ${{ inputs.symbols }}
