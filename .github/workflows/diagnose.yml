name: diagnose

# Manual only. Prints the real Alpaca account/asset/order-rejection details
# (including error bodies) so a 422 can explain itself. No trading logic here.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbols to inspect and test-order (space separated)"
        required: false
        default: "AAPL"
      qty:
        description: "Share quantity for the probe order"
        required: false
        default: "1"
      sequence:
        description: "Symbol to reproduce the buy-then-stop entry on (blank = plain probe)"
        required: false
        default: ""
      live_entry:
        description: "Symbol to run the REAL bot entry path on, then undo (blank = skip)"
        required: false
        default: ""

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe Alpaca paper account
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          if [ -n "${{ inputs.live_entry }}" ]; then
            python scripts/diagnose_alpaca.py --qty ${{ inputs.qty }} --live-entry ${{ inputs.live_entry }}
          elif [ -n "${{ inputs.sequence }}" ]; then
            python scripts/diagnose_alpaca.py --qty ${{ inputs.qty }} --sequence ${{ inputs.sequence }}
          else
            python scripts/diagnose_alpaca.py --qty ${{ inputs.qty }} --probe ${{ inputs.symbols }}
          fi
